<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Support Analysis</title><script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
<style>
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#e4e6ea;color:#222;padding:12px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.12);min-width:0}
.kc{border-left:5px solid #b3182d}.kl{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.04em}.kv{font-size:28px;font-weight:700;color:#1f1f1f;margin-top:4px}
.t{font-size:13px;font-weight:600;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#666;border-bottom:2px solid #b3182d;padding:4px}td{padding:4px;border-bottom:1px solid #eee}
</style></head><body>
<div class="k" id="k"></div>
<div class="g"><div class="card"><div class="t">Total Tickets by Queue</div><div id="q" style="height:260px"></div></div>
<div class="card"><div class="t">Total Tickets by Priority</div><div id="p" style="height:260px"></div></div>
<div class="card"><div class="t">Ticket by Types</div><div id="ty" style="height:260px"></div></div></div>
<div class="g2"><div class="card"><div class="t">Total Tickets by Month</div><div id="m" style="height:240px"></div></div>
<div class="card"><div class="t">Resolution time (days) by Month</div><div id="r" style="height:240px"></div></div></div>
<div class="g2"><div class="card"><div class="t">Tickets by Country</div><div id="c"></div></div>
<div class="card"><div class="t">Queue Summary</div><div id="s"></div></div></div>
<script>
const D={"kpi":[["Total Tickets","11,923"],["High Priority Share","38.3%"],["Avg Tickets / Day","32.58"],["Avg Resolution (days)","2.82"]],"queue":{"y":["General Inquiry","Human Resources","Sales and Pre-Sales","Service Outages and Maintenance","Returns and Exchanges","Billing and Payments","IT Support","Customer Service","Product Support","Technical Support"],"x":[168,205,330,442,582,1302,1391,1859,2232,3412]},"prio":{"y":["low","high","medium"],"x":[2400,4571,4952]},"type":{"y":["Change","Problem","Request","Incident"],"x":[1285,2498,3498,4642]},"months":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],"monthly":[1475,1259,1451,1409,1395,709,711,724,713,711,682,684],"res":[2.93,3.01,2.84,3.01,2.89,2.65,2.58,2.64,2.64,2.65,2.71,2.74],"country":[["Poland",1243,2.87],["Germany",1236,2.79],["Netherlands",1218,2.77],["Czechia",1207,2.89],["Sweden",1201,2.87],["Portugal",1196,2.8],["Belgium",1165,2.83],["Italy",1162,2.76],["Spain",1159,2.75],["France",1136,2.86]],"qsum":[["Technical Support",3412,57.9,2.82],["Product Support",2232,31.4,2.79],["Customer Service",1859,18.1,2.81],["IT Support",1391,46.2,2.81],["Billing and Payments",1302,27.9,2.85],["Returns and Exchanges",582,22.3,2.83],["Service Outages and Maintenance",442,69.9,2.83],["Sales and Pre-Sales",330,18.8,2.78],["Human Resources",205,11.2,2.78],["General Inquiry",168,16.7,3.23]]},RED="#b3182d",cfg={displayModeBar:false,responsive:true};
const L=(o={})=>Object.assign({margin:{l:10,r:20,t:8,b:30},paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI",size:11},yaxis:{automargin:true}},o);
document.getElementById("k").innerHTML=D.kpi.map(([l,v])=>`<div class="card kc"><div class="kl">${l}</div><div class="kv">${v}</div></div>`).join("");
const bar=(id,d)=>Plotly.newPlot(id,[{type:"bar",orientation:"h",x:d.x,y:d.y,text:d.x.map(v=>v.toLocaleString()),textposition:"outside",cliponaxis:false,marker:{color:RED},hoverinfo:"y+x"}],L({xaxis:{visible:false}}),cfg);
bar("q",D.queue);bar("p",D.prio);bar("ty",D.type);
Plotly.newPlot("m",[{type:"scatter",x:D.months,y:D.monthly,mode:"lines+markers",line:{color:RED,shape:"spline"},fill:"tozeroy",fillcolor:"rgba(179,24,45,.12)"}],L(),cfg);
Plotly.newPlot("r",[{type:"bar",x:D.months,y:D.res,marker:{color:RED}}],L(),cfg);
const tbl=(id,h,rows)=>document.getElementById(id).innerHTML="<table><tr>"+h.map(x=>`<th>${x}</th>`).join("")+"</tr>"+rows.map(r=>"<tr>"+r.map((x,i)=>`<td>${typeof x==="number"?x.toLocaleString():x}</td>`).join("")+"</tr>").join("")+"</table>";
tbl("c",["Country","Tickets","Avg res."],D.country);tbl("s",["Queue","Tickets","High %","Avg res."],D.qsum);
</script></body></html>
